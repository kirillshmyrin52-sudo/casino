<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Stars Casino Live</title>
    <script src="https://telegram.org"></script>
    <style>
        body { margin: 0; padding: 0; background: #0d0e15; color: #fff; font-family: sans-serif; text-align: center; padding-bottom: 80px; }
        .container { padding: 15px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #ffb703; margin: 10px 0 5px 0; font-size: 1.5rem; }
        .balance-board { background: #1a1c29; padding: 10px 25px; border-radius: 20px; border: 2px solid #ffb703; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #ffb703; display: inline-block; }
        .btn { background: #ffb703; color: #000; border: none; padding: 12px 20px; font-size: 0.95rem; font-weight: bold; border-radius: 12px; cursor: pointer; margin: 5px; }
        .btn.black { background: #212529; color: #fff; border: 2px solid #fff; }
        .btn.red { background: #e63946; color: #fff; }
        .btn:disabled { background: #444; color: #888; }
        .nav-tabs { display: flex; justify-content: space-around; width: 100%; position: fixed; bottom: 0; background: #141622; padding: 12px 0; border-top: 1px solid #24283b; z-index: 100; }
        .tab-btn { background: none; border: none; color: #888; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: #ffb703; }
        .section { display: none; width: 100%; max-width: 360px; }
        .section.active { display: block; }
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 15px 0; width: 280px; }
        .mine-cell { width: 50px; height: 50px; background: #1a1c29; border: 2px solid #24283b; border-radius: 8px; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        .wheel-box { width: 160px; height: 160px; border: 6px solid #ffb703; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; background: radial-gradient(circle, #212529 0%, #000 100%); margin: 15px 0; transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .case-box { background: #1a1c29; border: 2px dashed #ffb703; border-radius: 15px; padding: 20px; margin: 15px 0; width: 260px; }
        .case-roulette { font-size: 1.4rem; font-weight: bold; background: #000; padding: 10px; border-radius: 8px; margin: 10px 0; min-height: 30px; color: #ffb703; }
        .slots-box { display: flex; gap: 15px; font-size: 3rem; background: #000; padding: 15px; border-radius: 12px; border: 2px solid #ffb703; margin: 20px 0; width: 220px; justify-content: center; }
    </style>
</head>
<body>
<div class="container">
    <div class="balance-board">🪙 <span id="user-balance">Загрузка...</span> монет</div>

    <div id="page-roulette" class="section active">
        <h1>🌌 Stars Roulette</h1>
        <div id="wheel" class="wheel-box">🎲</div>
        <button class="btn red" onclick="playRoulette('red')">КРАСНОЕ</button>
        <button class="btn black" onclick="playRoulette('black')">ЧЕРНОЕ</button>
    </div>

    <div id="page-mines" class="section">
        <h1>💣 Игра Мины</h1>
        <button class="btn" id="start-mines-btn" onclick="startMinesGame()">Старт</button>
        <button class="btn red" id="cashout-mines-btn" onclick="cashoutMines()" disabled>Забрать: <span id="mines-win">0</span></button>
        <center><div class="mines-grid" id="mines-board"></div></center>
    </div>

    <div id="page-slots" class="section">
        <h1>🎰 Игровые Слоты</h1>
        <div class="slots-box"><span id="slot1">🍒</span><span id="slot2">🍋</span><span id="slot3">🍇</span></div>
        <button class="btn" onclick="spinSlots()">Спин (40)</button>
    </div>

    <div id="page-cases" class="section">
        <h1>🧳 Звёздные Кейсы</h1>
        <div class="case-box"><div class="case-roulette" id="case-status">100 монет</div><button class="btn" onclick="openCase()">Открыть</button></div>
    </div>

    <div id="page-promo" class="section">
        <h1>🎟️ Промокоды</h1>
        <input type="text" id="promo-input" placeholder="Введите код" style="padding:12px; border-radius:8px; background:#1a1c29; color:#fff; text-align:center;"><br><br>
        <button class="btn" onclick="activatePromo()">Активировать</button>
    </div>

    <div id="page-cash" class="section">
        <h1>💼 Касса</h1>
        <button class="btn" onclick="depositStars()">📥 Депозит (10 Stars)</button><br><br>
        <button class="btn red" onclick="alert('Заявка на вывод отправлена админу!')">📤 Вывод TON</button>
    </div>
</div>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchPage('roulette', this)">🎰 Рулетка</button>
    <button class="tab-btn" onclick="switchPage('mines', this)">💣 Мины</button>
    <button class="tab-btn" onclick="switchPage('slots', this)">🎰 Слоты</button>
    <button class="tab-btn" onclick="switchPage('cases', this)">🧳 Кейсы</button>
    <button class="tab-btn" onclick="switchPage('promo', this)">🎟️ Промо</button>
    <button class="tab-btn" onclick="switchPage('cash', this)">💼 Касса</button>
</div>

<script>
    const API_BASE = "https://onrender.com";
    var tg = window.Telegram.WebApp; tg.expand();
    var userId = tg.initDataUnsafe?.user?.id || 12345;

    async function loadProfile() {
        try {
            let res = await fetch(API_BASE + '/api/user/' + userId);
            let data = await res.json();
            document.getElementById('user-balance').innerText = data.balance;
        } catch(e) { document.getElementById('user-balance').innerText = "0"; }
    }

    function switchPage(name, element) {
        var sections = document.querySelectorAll('.section');
        for (var i = 0; i < sections.length; i++) { sections[i].style.display = 'none'; }
        var tabs = document.querySelectorAll('.tab-btn');
        for (var j = 0; j < tabs.length; j++) { tabs[j].classList.remove('active'); }
        document.getElementById('page-' + name).style.display = 'block';
        if (element) { element.classList.add('active'); }
    }

    async function playRoulette(betColor) {
        let res = await fetch(API_BASE + '/api/bet', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: parseInt(userId), bet_type: betColor, bet_amount: 50, game: 'roulette' })
        });
        if(res.status !== 200) return alert((await res.json()).detail);
        let data = await res.json();
        var wheel = document.getElementById('wheel');
        wheel.style.transform = 'rotate(' + (Math.floor(Math.random() * 2000) + 1000) + 'deg)';
        setTimeout(function() {
            alert(data.win ? '🌌 Победа! +100 монет!' : '🌌 Проигрыш.');
            loadProfile();
        }, 4000);
    }

    var minePositions = [], minesOpened = 0, minesActive = false;
    async function startMinesGame() {
        let res = await fetch(API_BASE + '/api/bet', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: parseInt(userId), bet_type: 'start', bet_amount: 50, game: 'mines' })
        });
        if(res.status !== 200) return alert((await res.json()).detail);
        loadProfile(); minePositions = []; minesOpened = 0; minesActive = true;
        while(minePositions.length < 4) {
            var r = Math.floor(Math.random() * 25);
            if(!minePositions.includes(r)) minePositions.push(r);
        }
        var board = document.getElementById('mines-board'); board.innerHTML = '';
        for(var i=0; i<25; i++) {
            (function(idx) {
                var cell = document.createElement('div'); cell.className = 'mine-cell'; cell.innerText = '❓';
                cell.onclick = async function() {
                    if(!minesActive || cell.innerText !== '❓') return;
                    if(minePositions.includes(idx)) {
                        cell.innerText = '💣'; cell.style.background = '#e63946'; minesActive = false;
                        alert("💥 БУМ! Ставка сгорела на сервере!");
                        document.getElementById('start-mines-btn').disabled = false;
                        document.getElementById('cashout-mines-btn').disabled = true;
                    } else {
                        cell.innerText = '💎'; cell.style.background = '#1e6091'; minesOpened++;
                        document.getElementById('mines-win').innerText = 50 + (minesOpened * 20);
                    }
                };
                board.appendChild(cell);
            })(i);
        }
        document.getElementById('start-mines-btn').disabled = true;
        document.getElementById('cashout-mines-btn').disabled = false;
        document.getElementById('mines-win').innerText = "50";
    }

    async function cashoutMines() {
        let winAmt = parseInt(document.getElementById('mines-win').innerText);
        await fetch(API_BASE + '/api/win', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: parseInt(userId), amount: winAmt })
        });
        minesActive = false;
        document.getElementById('start-mines-btn').disabled = false;
        document.getElementById('cashout-mines-btn').disabled = true;
        alert("🎉 Забрали выигрыш!"); loadProfile();
    }

    async function spinSlots() {
        let res = await fetch(API_BASE + '/api/bet', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: parseInt(userId), bet_type: 'spin', bet_amount: 40, game: 'slots' })
        });
        if(res.status !== 200) return alert((await res.json()).detail);
            loadProfile();
</script>
</body>
</html>.
