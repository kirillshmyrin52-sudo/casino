<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Stars Casino Ultimate</title>
    <script src="https://telegram.org"></script>
    <style>
        body { margin: 0; padding: 0; background: #0d0e15; color: #fff; font-family: sans-serif; text-align: center; padding-bottom: 80px; }
        .container { padding: 15px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #ffb703; margin: 10px 0 5px 0; font-size: 1.6rem; }
        .balance-board { background: #1a1c29; padding: 10px 25px; border-radius: 20px; border: 2px solid #ffb703; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #ffb703; display: inline-block; }
        .btn { background: #ffb703; color: #000; border: none; padding: 12px 20px; font-size: 0.95rem; font-weight: bold; border-radius: 12px; cursor: pointer; margin: 5px; }
        .btn.black { background: #212529; color: #fff; border: 2px solid #fff; }
        .btn.red { background: #e63946; color: #fff; }
        .btn:disabled { background: #444; color: #888; }
        .nav-tabs { display: flex; justify-content: space-around; width: 100%; position: fixed; bottom: 0; background: #141622; padding: 12px 0; border-top: 1px solid #24283b; z-index: 100; }
        .tab-btn { background: none; border: none; color: #888; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: #ffb703; }
        .section { display: none; width: 100%; max-width: 360px; }
        .section.active { display: block; }
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 15px 0; width: 280px; }
        .mine-cell { width: 50px; height: 50px; background: #1a1c29; border: 2px solid #24283b; border-radius: 8px; font-size: 1.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        .wheel-box { width: 180px; height: 180px; border: 6px solid #ffb703; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; background: radial-gradient(circle, #212529 0%, #000 100%); margin: 15px 0; transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .case-box { background: #1a1c29; border: 2px dashed #ffb703; border-radius: 15px; padding: 20px; margin: 15px 0; width: 260px; }
        .case-roulette { font-size: 1.4rem; font-weight: bold; background: #000; padding: 10px; border-radius: 8px; margin: 10px 0; min-height: 30px; color: #ffb703; }
        .slots-box { display: flex; gap: 15px; font-size: 3rem; background: #000; padding: 15px; border-radius: 12px; border: 2px solid #ffb703; margin: 20px 0; width: 220px; justify-content: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="balance-board">🪙 <span id="user-balance">500</span> монет</div>

    <!-- РУЛЕТКА -->
    <div id="page-roulette" class="section active">
        <h1>🌌 Stars Roulette</h1>
        <div id="wheel" class="wheel-box">🎲</div>
        <p>Ставка: 50 монет</p>
        <div class="btn-group">
            <button class="btn red" onclick="playRoulette('red')">КРАСНОЕ</button>
            <button class="btn black" onclick="playRoulette('black')">ЧЕРНОЕ</button>
        </div>
    </div>

    <!-- МИНЫ -->
    <div id="page-mines" class="section">
        <h1>💣 Игра Мины</h1>
        <p>Ставка: 50 монет. Найди алмазы!</p>
        <div style="margin-bottom: 10px;">
            <button class="btn" id="start-mines-btn" onclick="startMinesGame()">Начать игру</button>
            <button class="btn red" id="cashout-mines-btn" onclick="cashoutMines()" disabled>Забрать: <span id="mines-win">0</span></button>
        </div>
        <center><div class="mines-grid" id="mines-board"></div></center>
    </div>

    <!-- СЛОТЫ -->
    <div id="page-slots" class="section">
        <h1>🎰 Игровые Слоты</h1>
        <p>Ставка: 40 монет. Спинь три в ряд!</p>
        <center>
            <div class="slots-box">
                <span id="slot1">🍒</span>
                <span id="slot2">🍋</span>
                <span id="slot3">🍇</span>
            </div>
        </center>
        <button class="btn" onclick="spinSlots()">Cruтить слоты</button>
    </div>

    <!-- КЕЙСЫ -->
    <div id="page-cases" class="section">
        <h1>🧳 Звёздные Кейсы</h1>
        <p>Цена кейса: 100 монет</p>
        <div class="case-box">
            <div class="case-roulette" id="case-status">Кейс закрыт</div>
            <button class="btn" onclick="openCase()">Открыть Кейс</button>
        </div>
    </div>

    <!-- ПРОМОКОДЫ -->
    <div id="page-promo" class="section">
        <h1>🎟️ Промокоды</h1>
        <input type="text" id="promo-input" placeholder="Введите промокод" style="padding: 12px; border-radius: 8px; border: 1px solid #444; background: #1a1c29; color: #fff; width: 200px; text-align: center;"><br><br>
        <button class="btn" onclick="activatePromo()">Активировать</button>
    </div>

    <!-- КАССА -->
    <div id="page-cash" class="section">
        <h1>💼 Касса Вывода</h1>
        <button class="btn" onclick="alert('Платеж Telegram Stars готов')">📥 Пополнить баланс</button>
        <br><br>
        <input type="text" placeholder="Ваш TON кошелек" style="padding: 10px; border-radius: 8px; border: 1px solid #444; background: #1a1c29; color: #fff; width: 200px; text-align: center;"><br>
        <button class="btn red" onclick="alert('Заявка отправлена в сеть TON!')">📤 Вывести в TON/GRAM</button>
    </div>
</div>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="switchPage('roulette')">🎰 Рулетка</button>
    <button class="tab-btn" onclick="switchPage('mines')">💣 Мины</button>
    <button class="tab-btn" onclick="switchPage('slots')">🎰 Слоты</button>
    <button class="tab-btn" onclick="switchPage('cases')">🧳 Кейсы</button>
    <button class="tab-btn" onclick="switchPage('promo')">🎟️ Промо</button>
    <button class="tab-btn" onclick="switchPage('cash')">💼 Касса</button>
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let balance = parseInt(localStorage.getItem('casino_balance')) || 500;
    updateBalanceDisplay();

    function updateBalanceDisplay() {
        document.getElementById('user-balance').innerText = balance;
        localStorage.setItem('casino_balance', balance);
    }

    function switchPage(name) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`page-${name}`).classList.add('active');
        if (event && event.currentTarget) {
            event.currentTarget.classList.add('active');
        }
    }

    function playRoulette(betColor) {
        if (balance < 50) return alert("Недостаточно монет!");
        balance -= 50; updateBalanceDisplay();
        let wheel = document.getElementById('wheel');
        wheel.style.transform = `rotate(${Math.floor(Math.random() * 2000) + 1000}deg)`;
        setTimeout(() => {
            let winColor = Math.random() > 0.5 ? 'red' : 'black';
            if (betColor === winColor) {
                balance += 100; alert(`🌌 Выпало: ${winColor === 'red' ? 'КРАСНОЕ' : 'ЧЕРНОЕ'}! +100 монет!`);
            } else {
                alert(`🌌 Выпало: ${winColor === 'red' ? 'КРАСНОЕ' : 'ЧЕРНОЕ'}! Проигрыш.`);
            }
            updateBalanceDisplay();
        }, 4000);
    }

    let minePositions = []; let minesOpened = 0; let minesActive = false;
    function startMinesGame() {
        if (balance < 50) return alert("Недостаточно монет!");
        balance -= 50; updateBalanceDisplay();
        minePositions = []; minesOpened = 0; minesActive = true;
        while(minePositions.length < 4) {
            let r = Math.floor(Math.random() * 25);
            if(!minePositions.includes(r)) minePositions.push(r);
        }
        let board = document.getElementById('mines-board');
        board.innerHTML = '';
        for(let i=0; i<25; i++) {
            let cell = document.createElement('div');
            cell.className = 'mine-cell'; cell.innerText = '❓';
            cell.onclick = () => {
                if(!minesActive || cell.innerText !== '❓') return;
                if(minePositions.includes(i)) {
                    cell.innerText = '💣'; cell.style.background = '#e63946'; minesActive = false;
                    alert("💥 БУМ! Вы подорвались!");
                    document.getElementById('start-mines-btn').disabled = false;
                    document.getElementById('cashout-mines-btn').disabled = true;
                } else {
                    cell.innerText = '💎'; cell.style.background = '#1e6091'; minesOpened++;
                    document.getElementById('mines-win').innerText = 50 + (minesOpened * 20);
                }
            };
            board.appendChild(cell);
        }
        document.getElementById('start-mines-btn').disabled = true;
        document.getElementById('cashout-mines-btn').disabled = false;
        document.getElementById('mines-win').innerText = "50";
    }

    function cashoutMines() {
        balance += parseInt(document.getElementById('mines-win').innerText);
        updateBalanceDisplay(); minesActive = false;
        document.getElementById('start-mines-btn').disabled = false;
        document.getElementById('cashout-mines-btn').disabled = true;
        alert("🎉 Монеты забраны!");
    }

    function spinSlots() {
        if (balance < 40) return alert("Недостаточно монет!");
        balance -= 40; updateBalanceDisplay();
        let items = ['🍒', '🍋', '🍇', '💎', '7️⃣'];
        let r1 = items[Math.floor(Math.random() * items.length)];
        let r2 = items[Math.floor(Math.random() * items.length)];
