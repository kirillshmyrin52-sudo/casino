<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Epic Gift Premium</title>
    <script src="https://telegram.org"></script>
    <style>
        :root { --bg-main: #0c0d14; --bg-card: #181922; --btn-blue: #5856d6; --btn-green: #34c759; --text-main: #ffffff; --text-sub: #8e8e93; }
        body { margin: 0; padding: 0; background-color: var(--bg-main); color: var(--text-main); font-family: -apple-system, sans-serif; padding-bottom: 90px; -webkit-user-select: none; user-select: none; }
        .container { padding: 12px; max-width: 450px; margin: 0 auto; box-sizing: border-box; }
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .balance-block { display: flex; flex-direction: column; align-items: flex-start; }
        .balance-val { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 4px; }
        .deposit-btn { background: #1c1d26; color: #fff; border: 1px solid #2c2c35; padding: 8px 16px; font-size: 0.85rem; font-weight: 700; border-radius: 12px; }
        .hub-banner { width: 100%; border-radius: 18px; padding: 20px; text-align: left; box-sizing: border-box; margin-bottom: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .hub-banner.rocket { background: linear-gradient(135deg, #16223f 0%, #090d1a 100%); border-color: #24355c; }
        .hub-banner.playhub { background: linear-gradient(135deg, #163f20 0%, #091a0d 100%); border-color: #245c31; }
        .banner-title { font-size: 1.3rem; font-weight: 900; }
        .market-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 15px; }
        .pack-card { background: var(--bg-card); border-radius: 20px; padding: 14px; box-sizing: border-box; border: 1px solid #222330; text-align: center; }
        .pack-art { font-size: 3.5rem; margin: 10px 0; }
        .pack-info-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .pack-price-btn { border: none; padding: 8px 12px; font-size: 0.8rem; font-weight: bold; border-radius: 10px; color: #fff; background: var(--btn-blue); }
        .bottom-navigation { display: flex; justify-content: space-around; width: 100%; position: fixed; bottom: 0; left: 0; background: var(--bg-main); padding: 12px 0; border-top: 1px solid #1c1d26; z-index: 9999; }
        .navigation-item { background: none; border: none; color: var(--text-sub); font-size: 0.7rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .navigation-item.active { color: #fff; }
        .app-section { display: none; } .app-section.active { display: block; }
        .game-area { width: 100%; background: #13141c; border-radius: 16px; padding: 15px; box-sizing: border-box; border: 1px solid #242530; }
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px auto; width: 250px; }
        .mine-cell { width: 44px; height: 44px; background: #1c1d26; border: 1px solid #2c2c35; border-radius: 8px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="app-header">
        <div class="balance-block">
            <span style="font-size:0.75rem; color:var(--text-sub);">Баланс TON</span>
            <span class="balance-val">💎 <span id="user-balance">5.420</span></span>
        </div>
        <button class="deposit-btn" onclick="alert('Касса Stars временно на обслуживании')">Пополнить</button>
    </div>

    <!-- ГЛАВНАЯ СТРАНИЦА -->
    <div id="sect-main" class="app-section active">
        <div class="hub-banner rocket" onclick="openGameMode('rocket')">
            <div class="banner-title">🚀 РАКЕТКА</div>
            <div style="font-size:0.8rem; color:var(--text-sub); margin-top:4px;">Успей забрать ставку до взрыва!</div>
        </div>
        <div class="hub-banner playhub" onclick="openGameMode('playhub')">
            <div class="banner-title">🎮 PLAY HUB: МИНЫ</div>
            <div style="font-size:0.8rem; color:var(--text-sub); margin-top:4px;">Ищи кристаллы и обходи бомбы</div>
        </div>
        <div class="market-grid">
            <div class="pack-card"><div class="pack-art">🐸</div><div class="pack-info-row"><span>Pepe</span><button class="pack-price-btn" onclick="openPack()">15 💎</button></div></div>
            <div class="pack-card"><div class="pack-art">🌌</div><div class="pack-info-row"><span>Space</span><button class="pack-price-btn" onclick="openPack()">6 💎</button></div></div>
            <div class="pack-card"><div class="pack-art">🍿</div><div class="pack-info-row"><span>Movie</span><button class="pack-price-btn" onclick="openPack()">4 💎</button></div></div>
            <div class="pack-card"><div class="pack-art">🧢</div><div class="pack-info-row"><span>Autumn</span><button class="pack-price-btn" onclick="openPack()">3.5 💎</button></div></div>
        </div>
    </div>

    <!-- ИГРА РАКЕТА -->
    <div id="sect-game-rocket" class="app-section">
        <h2>🚀 Режим: Ракетка</h2>
        <div class="game-area">
            <div style="height:140px; display:flex; align-items:center; justify-content:center; background:#07080f; border-radius:12px; margin-bottom:15px; border:1px solid #1c1d26;">
                <div id="rocket-txt" style="font-size:2.5rem; font-weight:900; color:#5856d6;">x1.00</div>
            </div>
            <button class="pack-price-btn" id="rocket-btn" style="width:100%; padding:14px; font-size:1rem;" onclick="startRocket()">Полететь (0.5 💎)</button>
            <button class="pack-price-btn" style="width:100%; margin-top:10px; background:transparent; border:1px solid #2c2c35; color:var(--text-sub);" onclick="switchPage('main')">↩ Назад</button>
        </div>
    </div>

    <!-- ИГРА МИНЫ -->
    <div id="sect-game-playhub" class="app-section">
        <h2>💣 Режим: Сапер</h2>
        <div class="game-area">
            <div style="display:flex; gap:10px; margin-bottom:10px; justify-content:center;">
                <button class="pack-price-btn" id="m-start" onclick="startMines()">Старт (0.2 💎)</button>
                <button class="pack-price-btn" id="m-cash" style="background:var(--btn-green);" onclick="cashoutMines()" disabled>Забрать</button>
            </div>
            <center><div class="mines-grid" id="mines-board"></div></center>
            <button class="pack-price-btn" style="width:100%; background:transparent; border:1px solid #2c2c35; color:var(--text-sub);" onclick="switchPage('main')">↩ Назад</button>
        </div>
    </div>

    <div class="bottom-navigation">
        <button class="navigation-item" onclick="alert('Инвентарь пуст')">🧳<br>Инвентарь</button>
        <button class="navigation-item active" onclick="switchPage('main')">🏠<br>Главная</button>
        <button class="navigation-item" onclick="alert('Рефералов нет')">👥<br>Друзья</button>
    </div>
</div>

<script>
    var tg = window.Telegram.WebApp; tg.expand();
    function switchPage(t) {
        var s = document.querySelectorAll('.app-section'); for(var i=0;i<s.length;i++) s[i].style.display='none';
        document.getElementById('sect-'+t).style.display='block';
    }
    function openGameMode(m) { switchPage('game-'+m); }
    function openPack() { alert("🎁 Предмет успешно выбит и отправлен в инвентарь!"); }

    var rTimer=null, rX=1.00, rActive=false;
    function startRocket() {
        var b = document.getElementById('rocket-btn'); var t = document.getElementById('rocket-txt');
        if(!rActive) {
            rActive=true; rX=1.00; b.innerText="Забрать"; b.style.background="#34c759";
            var limit = Math.random()*3 + 1.1;
            rTimer = setInterval(function(){
                rX += 0.05; t.innerText = "x" + rX.toFixed(2);
                if(rX >= limit) { clearInterval(rTimer); rActive=false; t.innerText="💥 БУМ!"; b.innerText="Полететь (0.5 💎)"; b.style.background="#5856d6"; }
            }, 100);
        } else { clearInterval(rTimer); rActive=false; alert("🎉 Вы успешно забрали коэффициент x" + rX.toFixed(2)); b.innerText="Полететь (0.5 💎)"; b.style.background="#5856d6"; }
    }

    var mPos=[], mState=false;
    function startMines() {
        mPos=[]; mState=true; document.getElementById('m-start').disabled=true; document.getElementById('m-cash').disabled=false;
        while(mPos.length < 4) { var r = Math.floor(Math.random()*25); if(!mPos.includes(r)) mPos.push(r); }
        var board = document.getElementById('mines-board'); board.innerHTML='';
        for(var i=0; i<25; i++) {
            (function(idx){
                var cell = document.createElement('div'); cell.className='mine-cell'; cell.innerText='❓';
                cell.onclick = function() {
                    if(!mState || cell.innerText!=='❓') return;
                    if(mPos.includes(idx)) { cell.innerText='💣'; cell.style.background='#ff3b30'; mState=false; alert('💥 Взрыв! Ставка сгорела.'); document.getElementById('m-start').disabled=false; document.getElementById('m-cash').disabled=true; }
                    else { cell.innerText='💎'; cell.style.background='#007aff'; }
                }; board.appendChild(cell);
            })(i);
        }
    }
    function cashoutMines() { mState=false; document.getElementById('m-start').disabled=false; document.getElementById('m-cash').disabled=true; alert('🎉 Выигрыш сохранен на ваш баланс!'); }
</script>
</body>
</html>
